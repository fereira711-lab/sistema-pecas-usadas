<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pátio Peças</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=16">
</head>
<!-- Entrada do site: confere a sessão e abre o Painel (sem sessão, o auth.js leva para o Login). -->
<body data-auth="protected" class="auth-checking ui-v2">
  <main class="page" aria-live="polite">
    <p class="page-head__subtitle">Abrindo o painel…</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=6"></script>
  <script src="js/auth.js?v=6"></script>
  <script>
    document.addEventListener("auth:sessao-ok", () => {
      window.location.replace("painel.html");
    });
  </script>
</body>
</html>
