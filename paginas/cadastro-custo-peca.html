<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Custo da Peça</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="hero__tag">Cadastro</p>
      <h1>Cadastrar Custo da Peça</h1>
      <p class="hero__description">
        Registre um custo adicional vinculado a uma peça.
      </p>
    </div>
  </header>

  <main class="container form-layout">
    <section class="form-card">
      <h2>Cadastrar Custo da Peça</h2>

      <div class="form-group">
        <input id="pecaId" type="number" placeholder="ID da peça">
      </div>

      <div class="form-group">
        <input id="tipo" placeholder="Tipo do custo">
      </div>

      <div class="form-group">
        <input id="descricao" placeholder="Descrição">
      </div>

      <div class="form-group">
        <input id="valor" type="number" placeholder="Valor">
      </div>

      <div class="form-actions">
        <button type="button" class="button-primary" onclick="salvarCusto()">Salvar</button>
        <a class="button-secondary" href="../index.html">Voltar para o painel</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/supabase-service.js?v=14"></script>
  <script src="../js/custo-peca.js?v=6"></script>
</body>
</html>
