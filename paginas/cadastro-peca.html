<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Peça</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="hero__tag">Cadastro</p>
      <h1>Cadastrar Peça</h1>
      <p class="hero__description">
        Registre uma peça vinculada a uma origem.
      </p>
    </div>
  </header>

  <main class="container form-layout">
    <section class="form-card">
      <h2>Cadastrar Peça</h2>

      <div class="form-group">
        <input id="nome" placeholder="Nome da peça">
      </div>

      <div class="form-group">
        <input id="preco" type="number" placeholder="Preço de venda">
      </div>

      <div class="form-group">
        <input id="quantidade" type="number" placeholder="Quantidade">
      </div>

      <div class="form-group">
        <input id="custo" type="number" placeholder="Custo (se real ou simbólico)">
      </div>

      <div class="form-group">
        <select id="tipoCusto">
          <option value="real">Real</option>
          <option value="rateado">Rateado</option>
          <option value="simbolico">Simbólico</option>
        </select>
      </div>

      <div class="form-group">
        <select id="origemId">
          <option value="">Selecione a origem</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" class="button-primary" onclick="salvarPeca()">Salvar</button>
        <a class="button-secondary" href="../index.html">Voltar para o painel</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=4"></script>
  <script src="../js/supabase-service.js?v=4"></script>
  <script src="../js/peca.js?v=4"></script>
</body>
</html>
