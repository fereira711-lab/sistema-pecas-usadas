<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema de Gestao de Pecas Usadas</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-auth="login" class="ui-soft-dark login-page">
  <main class="login-shell">
    <section class="login-identity" aria-label="Identidade do sistema">
      <span class="login-badge">Sistema operacional</span>
      <h1>DWDW ERP</h1>
      <p>Gestão de peças usadas, estoque, vendas e origens.</p>
    </section>

    <section class="login-card" aria-label="Acesso ao sistema">
      <div class="login-card__header">
        <p class="login-eyebrow">Acesso interno</p>
        <h2>Entrar no sistema</h2>
        <p>Acesse o painel operacional do sistema.</p>
      </div>

      <form id="formLogin" class="login-form">
        <div class="form-group">
          <label for="emailLogin">E-mail</label>
          <input id="emailLogin" type="email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="senhaLogin">Senha</label>
          <input id="senhaLogin" type="password" autocomplete="current-password" required>
        </div>

        <p id="mensagemLogin" class="form-message" aria-live="polite"></p>

        <button id="botaoLogin" type="submit" class="button-primary login-button">Entrar</button>
      </form>

      <div class="login-note">
        Login aprovado abre o <strong>Painel Geral</strong>.
      </div>
    </section>
  </main>

  <footer class="login-footer">Ambiente de gestão interna</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=4"></script>
</body>
</html>
