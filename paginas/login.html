<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema de Gestao de Pecas Usadas</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-auth="login">
  <main class="auth-layout">
    <section class="auth-card">
      <p class="hero__tag">Acesso</p>
      <h1>Entrar no sistema</h1>
      <p class="hero__description">
        Use seu email e senha cadastrados no Supabase Auth.
      </p>

      <form id="formLogin" class="auth-form">
        <div class="form-group">
          <label for="emailLogin">Email</label>
          <input id="emailLogin" type="email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="senhaLogin">Senha</label>
          <input id="senhaLogin" type="password" autocomplete="current-password" required>
        </div>

        <p id="mensagemLogin" class="form-message" aria-live="polite"></p>

        <button id="botaoLogin" type="submit" class="button-primary auth-button">Entrar</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=4"></script>
</body>
</html>
