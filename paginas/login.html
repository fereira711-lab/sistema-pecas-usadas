<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Pátio Peças</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
  <link rel="stylesheet" href="../css/base.css?v=16">
  <link rel="stylesheet" href="../css/login.css?v=2">
</head>
<body data-auth="login" class="ui-v2 login">
  <aside class="login__marca" aria-label="Sistema">
    <div class="login__marca-topo">
      <span class="login__marca-icone" aria-hidden="true"><i class="ri-car-line"></i></span>
      <span class="login__marca-texto">
        <span class="login__marca-nome">Pátio Peças</span>
        <span class="login__marca-loja">DWDW Autopeças</span>
      </span>
    </div>
    <p class="login__marca-frase">O lucro de cada peça, de cada carro.</p>
  </aside>

  <main class="login__area">
    <section class="card login__card" aria-labelledby="tituloLogin">
      <div class="login__cabecalho">
        <h1 class="login__titulo" id="tituloLogin">Entrar</h1>
        <p class="login__subtitulo" id="subtituloLogin">Use o e-mail e a senha da loja.</p>
      </div>

      <form id="formLogin" class="login__form">
        <div class="field">
          <label class="field__label" for="emailLogin">E-mail</label>
          <input id="emailLogin" class="input" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label class="field__label" for="senhaLogin">Senha</label>
          <input id="senhaLogin" class="input" type="password" autocomplete="current-password" required>
        </div>

        <p id="mensagemLogin" class="form-message" aria-live="polite"></p>

        <button id="botaoLogin" type="submit" class="btn btn--primary login__botao">Entrar</button>
        <button id="botaoEsqueciSenha" type="button" class="login__link">Esqueci minha senha</button>
      </form>

      <form id="formRecuperarSenha" class="login__form" hidden>
        <div class="field">
          <label class="field__label" for="emailRecuperacao">E-mail</label>
          <input id="emailRecuperacao" class="input" type="email" autocomplete="email" required>
        </div>

        <p id="mensagemRecuperacao" class="form-message" aria-live="polite"></p>

        <button id="botaoRecuperarSenha" type="submit" class="btn btn--primary login__botao">Enviar link</button>
        <button id="botaoVoltarLogin" type="button" class="login__link">Voltar para a entrada</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=6"></script>
</body>
</html>
