<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tipos de custo · Pátio Peças</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css?v=16">
</head>
<body data-auth="protected" class="auth-checking ui-v2">
  <main class="page">
    <header class="page-head">
      <div class="page-head__text">
        <h1 class="page-head__title">Tipos de custo</h1>
        <p class="page-head__subtitle" id="resumoTiposCusto">Carregando tipos…</p>
      </div>
      <div class="page-head__actions">
        <button type="button" id="botaoNovoTipoCusto" class="btn btn--primary">
          <i class="ri-add-line" aria-hidden="true"></i>Novo tipo
        </button>
      </div>
    </header>

    <p id="mensagemTiposCusto" class="page-message" role="status"></p>

    <form id="formTipoCusto" class="card" aria-labelledby="tituloFormTipoCusto" hidden>
      <h2 class="card__title" id="tituloFormTipoCusto">Novo tipo de custo</h2>
      <input id="tipoCustoId" type="hidden">
      <div class="field-grid">
        <div class="field">
          <label class="field__label" for="nomeTipoCusto">Nome do tipo</label>
          <input id="nomeTipoCusto" class="input" type="text" placeholder="Ex.: Limpeza" autocomplete="off" required>
          <span class="field__hint">Maiúsculas, acentos e espaços não diferenciam: Limpeza e LIMPEZA são o mesmo tipo.</span>
        </div>
        <div class="field">
          <span class="field__label" id="rotuloCategoriaTipoCusto">Vale para</span>
          <div class="choice-group" role="group" aria-labelledby="rotuloCategoriaTipoCusto" id="categoriaTipoCusto">
            <button type="button" class="choice" data-categoria="peca" aria-pressed="true">Peça</button>
            <button type="button" class="choice" data-categoria="venda" aria-pressed="false">Venda</button>
            <button type="button" class="choice" data-categoria="ambos" aria-pressed="false">Ambos</button>
          </div>
        </div>
      </div>
      <p id="mensagemFormTipoCusto" class="page-message" role="status"></p>
      <div class="form-actions-bar">
        <button type="button" id="cancelarTipoCusto" class="btn btn--quiet">Cancelar</button>
        <button type="submit" class="btn btn--primary">Salvar tipo</button>
      </div>
    </form>

    <div class="toolbar">
      <div class="toolbar__group">
        <div class="search-field">
          <label class="sr-only" for="buscaTipoCusto">Buscar tipo</label>
          <i class="ri-search-line search-field__icon" aria-hidden="true"></i>
          <input id="buscaTipoCusto" class="input" type="search" placeholder="Buscar por nome do tipo" autocomplete="off">
        </div>
        <label class="sr-only" for="filtroStatusTiposCusto">Status</label>
        <select id="filtroStatusTiposCusto" class="select">
          <option value="">Ativos e inativos</option>
          <option value="ativo">Só ativos</option>
          <option value="inativo">Só inativos</option>
        </select>
      </div>
      <div class="segmented" role="group" aria-label="Vale para" id="filtroCategoriaTiposCusto">
        <button type="button" class="segmented__item" data-categoria="" aria-pressed="true">Todos <span class="segmented__count" data-contagem="">0</span></button>
        <button type="button" class="segmented__item" data-categoria="peca" aria-pressed="false">Peça <span class="segmented__count" data-contagem="peca">0</span></button>
        <button type="button" class="segmented__item" data-categoria="venda" aria-pressed="false">Venda <span class="segmented__count" data-contagem="venda">0</span></button>
        <button type="button" class="segmented__item" data-categoria="ambos" aria-pressed="false">Ambos <span class="segmented__count" data-contagem="ambos">0</span></button>
      </div>
    </div>

    <section class="card card--table" aria-label="Tipos de custo cadastrados">
      <div class="table-wrap">
        <table class="data-table data-table--responsive">
          <thead>
            <tr>
              <th scope="col">Tipo</th>
              <th scope="col">Vale para</th>
              <th scope="col">Usos</th>
              <th scope="col">Status</th>
              <th scope="col"><span class="sr-only">Ações</span></th>
            </tr>
          </thead>
          <tbody id="tabelaTiposCusto"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=6"></script>
  <script src="../js/supabase-service.js?v=36"></script>
  <script src="../js/tipos-custo.js?v=3"></script>
  <script src="../js/sidebar.js?v=14"></script>
</body>
</html>
