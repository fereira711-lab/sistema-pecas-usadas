<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análises</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css?v=16">
</head>
<body data-auth="protected" class="auth-checking ui-v2">
  <main class="page">
    <header class="page-head">
      <div class="page-head__text">
        <h1 class="page-head__title">Análises</h1>
        <p class="page-head__subtitle">Resultado financeiro por peça.</p>
        <nav class="tabs" aria-label="Tipos de análise">
          <a class="tabs__item" href="analise-produto.html" aria-current="page">Por produto</a>
          <a class="tabs__item" href="analise-periodo.html">Por período</a>
          <a class="tabs__item" href="analise-custos.html">Custos</a>
          <a class="tabs__item" href="giro-estoque.html">Giro de estoque</a>
        </nav>
      </div>
    </header>

    <p id="mensagemAnaliseProduto" class="page-message" role="status"></p>

    <section id="resumoAnaliseProduto" class="kpi-grid" aria-label="Resumo da análise por produto"></section>

    <div class="toolbar">
      <div class="toolbar__group">
        <div class="search-field">
          <label class="sr-only" for="buscaAnaliseProduto">Buscar peça</label>
          <i class="ri-search-line search-field__icon" aria-hidden="true"></i>
          <input id="buscaAnaliseProduto" class="input" type="search" placeholder="Buscar por SKU ou nome da peça" autocomplete="off">
        </div>
        <div class="filtro-periodo">
          <label class="filtro-periodo__rotulo" for="filtroDataInicialAnaliseProduto">Vendas de</label>
          <input id="filtroDataInicialAnaliseProduto" class="input filtro-periodo__data" type="date">
          <label class="filtro-periodo__rotulo" for="filtroDataFinalAnaliseProduto">até</label>
          <input id="filtroDataFinalAnaliseProduto" class="input filtro-periodo__data" type="date">
        </div>
        <label class="sr-only" for="filtroCanalAnaliseProduto">Canal</label>
        <select id="filtroCanalAnaliseProduto" class="select">
          <option value="">Todos os canais</option>
        </select>
        <label class="sr-only" for="ordenacaoAnaliseProduto">Ordenar por</label>
        <select id="ordenacaoAnaliseProduto" class="select">
          <option value="receita">Maior receita</option>
          <option value="lucro">Maior lucro</option>
          <option value="margem">Maior margem</option>
          <option value="quantidade">Mais vendidas</option>
          <option value="nome">Nome</option>
        </select>
      </div>
      <div class="segmented" role="group" aria-label="Resultado" id="filtroResultadoAnaliseProduto">
        <button type="button" class="segmented__item" data-resultado="com-venda" aria-pressed="true">Com venda <span class="segmented__count" data-contagem="com-venda">0</span></button>
        <button type="button" class="segmented__item" data-resultado="prejuizo" aria-pressed="false">Prejuízo <span class="segmented__count" data-contagem="prejuizo">0</span></button>
        <button type="button" class="segmented__item" data-resultado="pendente" aria-pressed="false">Custo não calculado <span class="segmented__count" data-contagem="pendente">0</span></button>
        <button type="button" class="segmented__item" data-resultado="" aria-pressed="false">Todas <span class="segmented__count" data-contagem="">0</span></button>
      </div>
    </div>

    <section class="card card--table" aria-label="Resultado por peça">
      <div class="table-wrap">
        <table class="data-table data-table--responsive">
          <thead>
            <tr>
              <th scope="col">Peça</th>
              <th scope="col" class="num">Vendidas</th>
              <th scope="col" class="num">Receita</th>
              <th scope="col" class="num" title="Entrada consumida mais os custos lançados na peça (limpeza, pintura…), divididos pelas unidades">Custo da peça</th>
              <th scope="col" class="num">Custos da venda</th>
              <th scope="col" class="num">Lucro</th>
              <th scope="col" class="num">Margem</th>
            </tr>
          </thead>
          <tbody id="tabelaAnaliseProduto"></tbody>
        </table>
      </div>
      <div class="pager" id="paginacaoAnaliseProduto" hidden>
        <span id="paginacaoTextoAnaliseProduto"></span>
        <div class="pager__buttons">
          <button type="button" class="btn btn--secondary btn--compact" id="paginaAnteriorAnaliseProduto">Anterior</button>
          <button type="button" class="btn btn--secondary btn--compact" id="paginaProximaAnaliseProduto">Próxima</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=5"></script>
  <script src="../js/moeda-utils.js?v=2"></script>
  <script src="../js/supabase-service.js?v=36"></script>
  <script src="../js/financeiro-utils.js?v=7"></script>
  <script src="../js/analise-produto.js?v=8"></script>
  <script src="../js/sidebar.js?v=13"></script>
</body>
</html>
