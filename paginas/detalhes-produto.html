<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes da peça</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css?v=16">
  <link rel="stylesheet" href="../css/detalhes-produto.css?v=3">
</head>
<body data-auth="protected" class="auth-checking ui-v2">
  <main class="page">
    <header class="page-head">
      <div class="page-head__text">
        <a class="page-head__back" href="produtos.html"><i class="ri-arrow-left-s-line" aria-hidden="true"></i>Produtos</a>
        <h1 class="page-head__title" id="tituloProduto">Peça</h1>
        <p class="page-head__subtitle" id="subtituloProduto">Carregando peça…</p>
      </div>
      <div class="page-head__actions" id="acoesProduto" hidden>
        <button type="button" id="botaoEditarProduto" class="btn btn--secondary">Editar dados</button>
        <details class="action-menu">
          <summary class="btn btn--icon" aria-label="Mais ações da peça"><i class="ri-more-2-fill" aria-hidden="true"></i></summary>
          <div class="action-menu__list">
            <button type="button" class="action-menu__item" id="botaoLancamentoCustoProduto">Lançar custo</button>
            <button type="button" class="action-menu__item" id="botaoAdicionarEstoqueProduto">Nova entrada de estoque</button>
            <button type="button" class="action-menu__item" id="botaoImagemProduto">Trocar imagem</button>
            <div class="action-menu__divider"></div>
            <button type="button" class="action-menu__item action-menu__item--danger" id="botaoExcluirProduto">Excluir peça</button>
          </div>
        </details>
        <button type="button" id="botaoVenderProduto" class="btn btn--primary">Vender</button>
        <a id="linkVerVendaProduto" class="btn btn--secondary" href="historico-vendas.html" hidden>Ver venda</a>
      </div>
    </header>

    <div id="mensagemProdutoNaoEncontrado" class="page-message" role="status"></div>
    <input id="imagemProdutoDetalhe" class="sr-only" type="file" accept="image/*" tabindex="-1" aria-hidden="true">

    <form id="formEditarProduto" class="card" aria-labelledby="tituloEditarProduto" hidden>
      <h2 class="card__title" id="tituloEditarProduto">Editar dados da peça</h2>
      <div class="field-grid field-grid--3">
        <div class="field">
          <label class="field__label" for="editarProdutoNome">Nome da peça</label>
          <input id="editarProdutoNome" class="input" type="text" required>
        </div>
        <div class="field">
          <label class="field__label" for="editarProdutoSku">SKU</label>
          <input id="editarProdutoSku" class="input" type="text" required>
        </div>
        <div class="field">
          <label class="field__label" for="editarProdutoPreco">Preço de venda</label>
          <input id="editarProdutoPreco" class="input" type="text" inputmode="decimal" autocomplete="off">
        </div>
      </div>
      <div class="field">
        <label class="field__label" for="editarProdutoCompatibilidade">Compatibilidade <span class="field__optional">(opcional)</span></label>
        <input id="editarProdutoCompatibilidade" class="input" type="text" placeholder="Ex.: Onix 2012–2019, Prisma 2013–2019">
      </div>
      <div class="field">
        <label class="field__label" for="editarProdutoObservacoes">Observação <span class="field__optional">(opcional)</span></label>
        <textarea id="editarProdutoObservacoes" class="input" rows="2"></textarea>
      </div>
      <div class="form-actions-bar">
        <button type="button" id="cancelarEdicaoProduto" class="btn btn--quiet">Cancelar</button>
        <button type="submit" class="btn btn--primary">Salvar dados</button>
      </div>
    </form>

    <section class="card peca-principal" id="dadosProduto" aria-label="Dados da peça" hidden></section>

    <section id="resumoFinanceiro" class="kpi-grid" aria-label="Resumo da peça"></section>

    <section id="secaoEntradasProduto" class="card card--flush" aria-labelledby="tituloEntradasProduto">
      <div class="card__head">
        <h2 class="card__title" id="tituloEntradasProduto">Entradas de estoque</h2>
        <button type="button" id="botaoAbrirEntradaProduto" class="btn btn--secondary btn--compact">Nova entrada</button>
      </div>

      <p id="mensagemEntradasProduto" class="page-message peca-secao__mensagem" role="status"></p>

      <form id="formAdicionarEstoqueProduto" class="peca-subform" aria-label="Nova entrada de estoque" hidden>
        <div class="field-grid peca-subform__campos">
          <div class="field">
            <label class="field__label" for="entradaProdutoOrigemId">Origem</label>
            <select id="entradaProdutoOrigemId" class="select">
              <option value="">Selecione a origem</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label" for="entradaProdutoQuantidade">Quantidade</label>
            <input id="entradaProdutoQuantidade" class="input" type="number" min="1" step="1">
          </div>
          <div class="field">
            <label class="field__label" for="entradaProdutoCustoUnitario">Custo unitário</label>
            <input id="entradaProdutoCustoUnitario" class="input" type="text" inputmode="decimal" placeholder="R$ 0,00" autocomplete="off">
          </div>
          <div class="field">
            <label class="field__label" for="entradaProdutoData">Data da entrada</label>
            <input id="entradaProdutoData" class="input" type="date">
          </div>
        </div>
        <p id="mensagemAdicionarEstoqueProduto" class="page-message" role="status"></p>
        <div class="form-actions-bar">
          <button type="button" id="cancelarEntradaProduto" class="btn btn--quiet">Cancelar</button>
          <button type="submit" class="btn btn--primary">Salvar entrada</button>
        </div>
      </form>

      <form id="formEditarEntradaProduto" class="peca-subform" aria-label="Editar entrada de estoque" hidden>
        <input id="editarEntradaProdutoId" type="hidden">
        <div class="field-grid peca-subform__campos">
          <div class="field">
            <label class="field__label" for="editarEntradaProdutoOrigemId">Origem</label>
            <select id="editarEntradaProdutoOrigemId" class="select">
              <option value="">Selecione a origem</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label" for="editarEntradaProdutoQuantidade">Quantidade</label>
            <input id="editarEntradaProdutoQuantidade" class="input" type="number" min="1" step="1">
          </div>
          <div class="field">
            <label class="field__label" for="editarEntradaProdutoCustoUnitario">Custo unitário</label>
            <input id="editarEntradaProdutoCustoUnitario" class="input" type="text" inputmode="decimal" placeholder="R$ 0,00" autocomplete="off">
          </div>
          <div class="field">
            <label class="field__label" for="editarEntradaProdutoData">Data da entrada</label>
            <input id="editarEntradaProdutoData" class="input" type="date">
          </div>
        </div>
        <p id="mensagemEditarEntradaProduto" class="page-message" role="status"></p>
        <div class="form-actions-bar">
          <button type="button" id="cancelarEdicaoEntradaProduto" class="btn btn--quiet">Cancelar</button>
          <button type="submit" class="btn btn--primary">Salvar entrada</button>
        </div>
      </form>

      <div class="table-wrap">
        <table class="data-table data-table--responsive">
          <thead>
            <tr>
              <th scope="col">Data</th>
              <th scope="col">Origem</th>
              <th scope="col" class="num">Qtd.</th>
              <th scope="col" class="num">Consumida</th>
              <th scope="col" class="num">Saldo</th>
              <th scope="col" class="num">Custo unitário</th>
              <th scope="col" class="num">Valor atribuído</th>
              <th scope="col"><span class="sr-only">Ações</span></th>
            </tr>
          </thead>
          <tbody id="tabelaEntradasProduto"></tbody>
        </table>
      </div>
    </section>

    <section class="card card--flush" aria-labelledby="tituloCustosProduto">
      <div class="card__head">
        <h2 class="card__title" id="tituloCustosProduto">Custos da peça</h2>
        <a class="card__link" id="linkLancarCustoProduto" href="cadastro-custo.html">Lançar custo</a>
      </div>

      <p id="mensagemCustosProduto" class="page-message peca-secao__mensagem" role="status"></p>

      <form id="formEditarCustoProduto" class="peca-subform" aria-label="Editar custo da peça" hidden>
        <input id="editarCustoId" type="hidden">
        <div class="field-grid peca-subform__campos">
          <div class="field">
            <label class="field__label" for="editarCustoTipo">Tipo</label>
            <select id="editarCustoTipo" class="select"></select>
          </div>
          <div class="field">
            <label class="field__label" for="editarCustoValor">Valor</label>
            <input id="editarCustoValor" class="input" type="text" inputmode="decimal" autocomplete="off">
          </div>
          <div class="field">
            <label class="field__label" for="editarCustoDescricao">Descrição</label>
            <input id="editarCustoDescricao" class="input" type="text">
          </div>
          <div class="field">
            <label class="field__label" for="editarCustoData">Data</label>
            <input id="editarCustoData" class="input" type="date">
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="editarCustoObservacoes">Observação <span class="field__optional">(opcional)</span></label>
          <input id="editarCustoObservacoes" class="input" type="text">
        </div>
        <div class="form-actions-bar">
          <button type="button" id="cancelarEdicaoCusto" class="btn btn--quiet">Cancelar</button>
          <button type="submit" class="btn btn--primary">Salvar custo</button>
        </div>
      </form>

      <div class="table-wrap">
        <table class="data-table data-table--responsive">
          <thead>
            <tr>
              <th scope="col">Data</th>
              <th scope="col">Tipo</th>
              <th scope="col">Descrição</th>
              <th scope="col" class="num">Valor</th>
              <th scope="col"><span class="sr-only">Ações</span></th>
            </tr>
          </thead>
          <tbody id="tabelaCustosProduto"></tbody>
        </table>
      </div>
    </section>

    <section class="card card--flush" aria-labelledby="tituloVendasProduto">
      <div class="card__head">
        <h2 class="card__title" id="tituloVendasProduto">Vendas</h2>
      </div>

      <p id="mensagemVendasProduto" class="page-message peca-secao__mensagem" role="status"></p>

      <div class="table-wrap">
        <table class="data-table data-table--responsive">
          <thead>
            <tr>
              <th scope="col">Data</th>
              <th scope="col">Canal</th>
              <th scope="col" class="num">Qtd.</th>
              <th scope="col" class="num">Valor</th>
              <th scope="col" class="num">Lucro</th>
              <th scope="col"><span class="sr-only">Ações</span></th>
            </tr>
          </thead>
          <tbody id="tabelaVendasProduto"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=4"></script>
  <script src="../js/moeda-utils.js?v=2"></script>
  <script src="../js/supabase-service.js?v=36"></script>
  <script src="../js/financeiro-utils.js?v=7"></script>
  <script src="../js/alertas-regras.js?v=5"></script>
  <script src="../js/detalhes-produto.js?v=23"></script>
  <script src="../js/sidebar.js?v=10"></script>
</body>
</html>
