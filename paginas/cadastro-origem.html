<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Origem</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="hero__tag">Cadastro</p>
      <h1>Cadastrar Origem</h1>
      <p class="hero__description">
        Registre de onde vieram as pecas antes de cadastrar os itens no estoque.
      </p>
    </div>
  </header>

  <main class="container form-layout">
    <section class="form-card">
      <h2>Cadastrar Origem</h2>

      <div class="form-group">
        <input id="descricao" placeholder="Descricao (ex: Gol 1.0 2005)">
      </div>

      <div class="form-group">
        <input id="custoTotal" type="number" min="0" step="0.01" placeholder="Custo total">
      </div>

      <div class="form-group">
        <select id="tipoOrigem">
          <option value="">Tipo da origem</option>
          <option value="Carro para desmonte">Carro para desmonte</option>
          <option value="Lote">Lote</option>
          <option value="Compra avulsa">Compra avulsa</option>
        </select>
      </div>

      <div class="form-group">
        <select id="custoTipo">
          <option value="">Tipo de custo</option>
          <option value="compra">Compra</option>
          <option value="frete">Frete</option>
          <option value="outro">Outro</option>
        </select>
      </div>

      <div class="form-group">
        <textarea id="observacoes" rows="4" placeholder="Observacoes"></textarea>
      </div>

      <p id="mensagemFormulario" class="form-message" aria-live="polite"></p>

      <div class="form-actions">
        <button type="button" class="button-primary" onclick="salvarOrigem()">Salvar</button>
        <a class="button-secondary" href="../index.html">Voltar para o painel</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=4"></script>
  <script src="../js/supabase-service.js?v=14"></script>
  <script src="../js/origem.js?v=4"></script>
</body>
</html>
