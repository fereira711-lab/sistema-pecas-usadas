<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Origem</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="hero__tag">Cadastro</p>
      <h1>Cadastrar Origem</h1>
      <p class="hero__description">
        Registre de onde vieram as peças antes de cadastrar os itens no estoque.
      </p>
    </div>
  </header>

  <main class="container form-layout">
    <section class="form-card">
      <h2>Cadastrar Origem</h2>

      <div class="form-group">
        <input id="descricao" placeholder="Descrição (ex: Gol 1.0 2005)">
      </div>

      <div class="form-group">
        <input id="valor" type="number" placeholder="Valor pago">
      </div>

      <div class="form-group">
        <select id="tipo">
          <option value="carro">Carro</option>
          <option value="lote">Lote</option>
          <option value="avulsa">Avulsa</option>
        </select>
      </div>

      <p id="mensagemFormulario" class="form-message" aria-live="polite"></p>

      <div class="form-actions">
        <button type="button" class="button-primary" onclick="salvarOrigem()">Salvar</button>
        <a class="button-secondary" href="../index.html">Voltar para o painel</a>
      </div>
    </section>
  </main>

  <script src="../js/origem.js"></script>
</body>
</html>
