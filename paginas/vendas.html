<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Venda</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="hero__tag">Vendas</p>
      <h1>Registrar Venda</h1>
      <p class="hero__description">
        Selecione uma peça do estoque e registre a venda.
      </p>
    </div>
  </header>

  <main class="container form-layout">
    <section class="form-card">
      <form id="formVenda">
        <div class="form-group">
          <label for="produtoVenda">Produto *</label>
          <select id="produtoVenda" name="produtoVenda" required>
            <option value="">Selecione um produto</option>
          </select>
        </div>

        <div class="form-row form-row--three">
          <div class="form-group">
            <label for="quantidadeVendida">Quantidade vendida *</label>
            <input
              id="quantidadeVendida"
              name="quantidadeVendida"
              type="number"
              min="1"
              step="1"
              placeholder="Ex: 1"
              required
            >
          </div>

          <div class="form-group">
            <label for="precoUnitario">Preço de venda unitário *</label>
            <input
              id="precoUnitario"
              name="precoUnitario"
              type="number"
              min="0"
              step="0.01"
              placeholder="Ex: 250.00"
              required
            >
          </div>

          <div class="form-group">
            <label for="valorTotal">Valor total</label>
            <input id="valorTotal" name="valorTotal" type="number" readonly>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dataVenda">Data da venda *</label>
            <input id="dataVenda" name="dataVenda" type="date" required>
          </div>

          <div class="form-group">
            <label for="clienteVenda">Cliente</label>
            <input
              id="clienteVenda"
              name="clienteVenda"
              type="text"
              placeholder="Ex: Cliente exemplo"
            >
          </div>
        </div>

        <div class="form-row form-row--three">
          <div class="form-group">
            <label for="custoUnitarioAtualizado">Custo unitário atualizado</label>
            <input id="custoUnitarioAtualizado" name="custoUnitarioAtualizado" type="number" readonly>
          </div>

          <div class="form-group">
            <label for="custoTotalVenda">Custo total da venda</label>
            <input id="custoTotalVenda" name="custoTotalVenda" type="number" readonly>
          </div>

          <div class="form-group">
            <label for="lucroBruto">Lucro bruto</label>
            <input id="lucroBruto" name="lucroBruto" type="number" readonly>
          </div>
        </div>

        <div class="form-group">
          <label for="observacoesVenda">Observações</label>
          <textarea
            id="observacoesVenda"
            name="observacoesVenda"
            rows="4"
            placeholder="Ex: Venda registrada pelo front-end"
          ></textarea>
        </div>

        <p id="mensagemVenda" class="form-message" aria-live="polite"></p>

        <div class="form-actions">
          <button type="submit" class="button-primary">Registrar Venda</button>
          <a class="button-secondary" href="../index.html">Voltar para o painel</a>
        </div>
      </form>
    </section>
  </main>

  <script src="../js/vendas.js"></script>
</body>
</html>
