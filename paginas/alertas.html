<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alertas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css?v=16">
  <link rel="stylesheet" href="../css/alertas.css?v=3">
</head>
<body data-auth="protected" data-contador-pelo-painel="sim" class="auth-checking ui-v2">
  <main class="page">
    <header class="page-head">
      <div class="page-head__text">
        <h1 class="page-head__title">Alertas</h1>
        <p class="page-head__subtitle" id="resumoAlertas">Carregando alertas…</p>
      </div>
    </header>

    <p id="mensagemAlertas" class="page-message" role="status"></p>

    <div class="toolbar">
      <div class="toolbar__group">
        <div class="search-field">
          <label class="sr-only" for="buscaAlertas">Buscar alertas</label>
          <i class="ri-search-line search-field__icon" aria-hidden="true"></i>
          <input id="buscaAlertas" class="input" type="search" placeholder="Buscar por SKU, peça, origem ou canal" autocomplete="off">
        </div>
      </div>
      <div class="segmented" role="group" aria-label="Gravidade" id="filtroGravidadeAlertas">
        <button type="button" class="segmented__item" data-gravidade="todas" aria-pressed="true">Todos <span class="segmented__count" data-contagem="todas">0</span></button>
        <button type="button" class="segmented__item" data-gravidade="danger" aria-pressed="false">Críticos <span class="segmented__count" data-contagem="danger">0</span></button>
        <button type="button" class="segmented__item" data-gravidade="warning" aria-pressed="false">Atenção <span class="segmented__count" data-contagem="warning">0</span></button>
        <button type="button" class="segmented__item" data-gravidade="info" aria-pressed="false">Informação <span class="segmented__count" data-contagem="info">0</span></button>
      </div>
    </div>

    <div id="gruposAlertas" class="alertas-grupos" aria-live="polite"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=6"></script>
  <script src="../js/supabase-service.js?v=36"></script>
  <script src="../js/moeda-utils.js?v=2"></script>
  <script src="../js/financeiro-utils.js?v=7"></script>
  <script src="../js/alertas-regras.js?v=7"></script>
  <script src="../js/alertas.js?v=8"></script>
  <script src="../js/sidebar.js?v=13"></script>
</body>
</html>
