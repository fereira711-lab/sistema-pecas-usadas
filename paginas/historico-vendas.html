<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico de Vendas</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="hero__tag">Vendas</p>
      <h1>Histórico de Vendas</h1>
      <p class="hero__description">
        Consulte vendas registradas e abra os detalhes quando precisar do financeiro completo.
      </p>
    </div>
  </header>

  <main class="container stock-layout">
    <section class="summary-grid" aria-label="Resumo das vendas">
      <article class="summary-card">
        <span>Total de vendas</span>
        <strong id="totalVendas">0</strong>
      </article>

      <article class="summary-card">
        <span>Peças vendidas</span>
        <strong id="pecasVendidas">0</strong>
      </article>

    </section>

    <section class="stock-card">
      <div class="stock-header">
        <div>
          <h2>Vendas registradas</h2>
          <p>Lista de vendas registradas no sistema.</p>
        </div>
        <a class="button-secondary" href="../index.html">Voltar para o painel</a>
      </div>

      <p id="mensagemHistorico" class="empty-message"></p>

      <form id="formFiltrosHistorico" class="section-spaced">
        <div class="form-row">
          <div class="form-group">
            <label for="dataInicialHistorico">Data inicial</label>
            <input id="dataInicialHistorico" type="date">
          </div>

          <div class="form-group">
            <label for="dataFinalHistorico">Data final</label>
            <input id="dataFinalHistorico" type="date">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="filtroSkuHistorico">SKU da peça</label>
            <input id="filtroSkuHistorico" type="search" placeholder="Pesquisar por parte do SKU">
          </div>

          <div class="form-group">
            <label for="filtroNomeHistorico">Nome da peça</label>
            <input id="filtroNomeHistorico" type="search" placeholder="Pesquisar por parte do nome">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="filtroCanalHistorico">Canal de venda</label>
            <input id="filtroCanalHistorico" type="search" placeholder="Ex: Mercado Livre, balcão, WhatsApp">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="button-primary">Filtrar vendas</button>
          <button type="button" id="limparFiltrosHistorico" class="button-secondary">Limpar filtros</button>
        </div>
      </form>

      <div class="table-wrapper">
        <table class="stock-table">
          <thead>
            <tr>
              <th>Data</th>
              <th>SKU</th>
              <th>Peça</th>
              <th>Quantidade</th>
              <th>Canal</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaHistoricoVendas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/supabase-service.js?v=16"></script>
  <script src="../js/historico-vendas.js?v=8"></script>
</body>
</html>
