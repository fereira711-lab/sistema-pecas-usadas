<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historico de Vendas</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-auth="protected" class="auth-checking ui-soft-dark sales-history-page">
  <header class="page-header">
    <div>
      <p class="hero__tag">Vendas operacionais</p>
      <h1>Historico de vendas</h1>
      <p class="hero__description">
        Consulte vendas registradas e abra os detalhes quando necessario.
      </p>
    </div>
  </header>

  <main class="container stock-layout sales-history-layout">
    <section class="stock-card sales-history-shell">
      <div class="stock-header sales-history-header">
        <div>
          <span class="piece-form-eyebrow">Historico operacional</span>
          <h2>Vendas registradas</h2>
        </div>
        <a class="button-secondary" href="../index.html">Voltar para o painel</a>
      </div>

      <form id="formFiltrosHistorico" class="sales-history-filters operational-filter-toolbar">
        <div class="products-main-controls operational-filter-main-controls sales-history-main-controls">
          <div class="form-group products-search-field sales-history-search">
            <label for="buscaRapidaHistorico">Buscar venda</label>
            <input id="buscaRapidaHistorico" type="search" placeholder="Buscar por SKU ou nome da peca">
          </div>

          <button id="botaoAbrirFiltrosHistorico" type="button" class="button-secondary products-filter-toggle sales-history-filter-button" aria-controls="painelFiltrosHistorico" aria-expanded="false">Filtros</button>
        </div>

        <aside id="painelFiltrosHistorico" class="products-filter-panel sales-history-filter-panel" aria-label="Filtros avancados de vendas">
          <div class="products-filter-panel__header sales-history-filter-panel__header">
            <h3>Filtros avancados</h3>
            <button id="botaoFecharFiltrosHistorico" class="products-filter-close" type="button" aria-label="Fechar filtros">X</button>
          </div>

          <div class="products-filters sales-history-advanced">
            <div class="form-group">
              <label for="dataInicialHistorico">Data inicial</label>
              <input id="dataInicialHistorico" type="date">
            </div>

            <div class="form-group">
              <label for="dataFinalHistorico">Data final</label>
              <input id="dataFinalHistorico" type="date">
            </div>

            <div class="form-group">
              <label for="filtroNomeHistorico">Nome da peca</label>
              <input id="filtroNomeHistorico" type="search" placeholder="Parte do nome">
            </div>

            <div class="form-group">
              <label for="filtroCanalHistorico">Canal</label>
              <input id="filtroCanalHistorico" type="search" placeholder="Ex.: WhatsApp">
            </div>
          </div>

          <div class="products-filter-panel__actions sales-history-filter-panel__actions">
            <button type="button" id="limparFiltrosHistorico" class="button-secondary">Limpar filtros</button>
            <button type="submit" class="button-primary">Aplicar/Fechar</button>
          </div>
        </aside>
      </form>

      <p id="mensagemHistorico" class="empty-message"></p>

      <div class="table-wrapper">
        <table class="stock-table sales-history-table">
          <thead>
            <tr>
              <th>Data</th>
              <th>SKU</th>
              <th>Peca</th>
              <th>Quantidade</th>
              <th>Canal</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody id="tabelaHistoricoVendas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=4"></script>
  <script src="../js/supabase-service.js?v=16"></script>
  <script src="../js/historico-vendas.js?v=11"></script>
  <script src="../js/sidebar.js?v=5"></script>
</body>
</html>
