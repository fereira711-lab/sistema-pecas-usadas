<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análises</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css?v=16">
</head>
<body data-auth="protected" class="auth-checking ui-v2">
  <main class="page">
    <header class="page-head">
      <div class="page-head__text">
        <h1 class="page-head__title">Análises</h1>
        <p class="page-head__subtitle">Quais peças vendem rápido e quais estão paradas.</p>
        <nav class="tabs" aria-label="Tipos de análise">
          <a class="tabs__item" href="analise-produto.html">Por produto</a>
          <a class="tabs__item" href="analise-periodo.html">Por período</a>
          <a class="tabs__item" href="analise-custos.html">Custos</a>
          <a class="tabs__item" href="giro-estoque.html" aria-current="page">Giro de estoque</a>
        </nav>
      </div>
    </header>

    <p id="mensagemGiroEstoque" class="page-message" role="status"></p>

    <section id="resumoGiroEstoque" class="kpi-grid" aria-label="Resumo do giro de estoque"></section>

    <div class="toolbar">
      <div class="toolbar__group">
        <div class="search-field">
          <label class="sr-only" for="buscaGiroEstoque">Buscar peça</label>
          <i class="ri-search-line search-field__icon" aria-hidden="true"></i>
          <input id="buscaGiroEstoque" class="input" type="search" placeholder="Buscar por SKU ou nome da peça" autocomplete="off">
        </div>
        <label class="sr-only" for="periodoRapidoGiroEstoque">Vendas no período</label>
        <select id="periodoRapidoGiroEstoque" class="select">
          <option value="todos">Todo o período</option>
          <option value="hoje">Hoje</option>
          <option value="7">Últimos 7 dias</option>
          <option value="30">Últimos 30 dias</option>
          <option value="90">Últimos 90 dias</option>
          <option value="personalizado">Personalizado</option>
        </select>
        <div class="filtro-periodo">
          <label class="filtro-periodo__rotulo" for="dataInicialGiroEstoque">De</label>
          <input id="dataInicialGiroEstoque" class="input filtro-periodo__data" type="date">
          <label class="filtro-periodo__rotulo" for="dataFinalGiroEstoque">até</label>
          <input id="dataFinalGiroEstoque" class="input filtro-periodo__data" type="date">
        </div>
        <label class="sr-only" for="filtroOrigemGiroEstoque">Origem</label>
        <select id="filtroOrigemGiroEstoque" class="select">
          <option value="">Todas as origens</option>
        </select>
        <label class="sr-only" for="ordenacaoGiroEstoque">Ordenar por</label>
        <select id="ordenacaoGiroEstoque" class="select">
          <option value="giro">Mais vendidas</option>
          <option value="parado">Mais tempo sem venda</option>
          <option value="ultima-venda">Última venda</option>
          <option value="estoque">Menor estoque</option>
          <option value="nome">Nome</option>
        </select>
      </div>
      <div class="segmented" role="group" aria-label="Situação" id="filtroStatusGiroEstoque">
        <button type="button" class="segmented__item" data-status="" aria-pressed="true">Todas <span class="segmented__count" data-contagem="">0</span></button>
        <button type="button" class="segmented__item" data-status="girando" aria-pressed="false">Girando <span class="segmented__count" data-contagem="girando">0</span></button>
        <button type="button" class="segmented__item" data-status="lento" aria-pressed="false">Lento <span class="segmented__count" data-contagem="lento">0</span></button>
        <button type="button" class="segmented__item" data-status="parado" aria-pressed="false">Parado <span class="segmented__count" data-contagem="parado">0</span></button>
        <button type="button" class="segmented__item" data-status="sem-estoque" aria-pressed="false">Sem estoque <span class="segmented__count" data-contagem="sem-estoque">0</span></button>
      </div>
    </div>

    <section class="card card--table" aria-label="Giro por peça">
      <div class="table-wrap">
        <table class="data-table data-table--responsive">
          <thead>
            <tr>
              <th scope="col">Peça</th>
              <th scope="col" class="num">Estoque</th>
              <th scope="col" class="num">Vendidas</th>
              <th scope="col">Última venda</th>
              <th scope="col" class="num">Sem venda há</th>
              <th scope="col">Situação</th>
            </tr>
          </thead>
          <tbody id="tabelaGiroEstoque"></tbody>
        </table>
      </div>
      <div class="pager" id="paginacaoGiroEstoque" hidden>
        <span id="paginacaoTextoGiroEstoque"></span>
        <div class="pager__buttons">
          <button type="button" class="btn btn--secondary btn--compact" id="paginaAnteriorGiroEstoque">Anterior</button>
          <button type="button" class="btn btn--secondary btn--compact" id="paginaProximaGiroEstoque">Próxima</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=4"></script>
  <script src="../js/supabase-service.js?v=36"></script>
  <script src="../js/alertas-regras.js?v=4"></script>
  <script src="../js/giro-estoque.js?v=3"></script>
  <script src="../js/sidebar.js?v=9"></script>
</body>
</html>
