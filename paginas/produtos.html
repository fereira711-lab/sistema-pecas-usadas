<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque / Produtos</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="hero__tag">Estoque</p>
      <h1>Estoque / Produtos</h1>
      <p class="hero__description">
        Visualize peças, estoque, custos, vendas e lucro.
      </p>
    </div>
  </header>

  <main class="container stock-layout">
    <section class="stock-card">
      <div class="stock-header">
        <div>
          <h2>Peças cadastradas</h2>
          <p>Lista consolidada de peças, estoque, custos, vendas e lucro.</p>
        </div>
        <a class="button-secondary" href="cadastro-peca.html">Cadastrar peça</a>
      </div>

      <p id="mensagemProdutos" class="empty-message"></p>

      <div class="form-group">
        <input id="buscaProdutos" type="search" placeholder="Pesquisar peça (nome ou SKU)">
      </div>

      <div id="tabelaProdutos" class="product-card-grid" aria-label="Produtos cadastrados"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/supabase-service.js?v=22"></script>
  <script src="../js/produtos.js?v=19"></script>
</body>
</html>
