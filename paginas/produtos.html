<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css?v=9">
  <link rel="stylesheet" href="../css/produtos.css?v=3">
</head>
<body data-auth="protected" class="auth-checking ui-v2">
  <main class="page">
    <header class="page-head">
      <div class="page-head__text">
        <h1 class="page-head__title">Produtos</h1>
        <p class="page-head__subtitle" id="resumoProdutos">Carregando peças…</p>
      </div>
      <div class="page-head__actions">
        <a class="btn btn--primary" href="cadastro-peca.html">
          <i class="ri-add-line" aria-hidden="true"></i>Nova peça
        </a>
      </div>
    </header>

    <p id="mensagemProdutos" class="page-message" role="status"></p>

    <div class="toolbar">
      <div class="toolbar__group">
        <div class="search-field">
          <label class="sr-only" for="buscaProdutos">Buscar produtos</label>
          <i class="ri-search-line search-field__icon" aria-hidden="true"></i>
          <input id="buscaProdutos" class="input" type="search" placeholder="Buscar por SKU, peça, veículo ou compatibilidade" autocomplete="off">
        </div>
        <label class="sr-only" for="filtroOrigemProdutos">Filtrar por origem</label>
        <select id="filtroOrigemProdutos" class="select">
          <option value="">Todas as origens</option>
        </select>
      </div>
      <div class="segmented" role="group" aria-label="Situação" id="filtroSituacaoProdutos">
        <button type="button" class="segmented__item" data-situacao="todas" aria-pressed="true">Todas <span class="segmented__count" data-contagem="todas">0</span></button>
        <button type="button" class="segmented__item" data-situacao="estoque" aria-pressed="false">Em estoque <span class="segmented__count" data-contagem="estoque">0</span></button>
        <button type="button" class="segmented__item" data-situacao="vendidas" aria-pressed="false">Vendidas <span class="segmented__count" data-contagem="vendidas">0</span></button>
        <button type="button" class="segmented__item" data-situacao="paradas" aria-pressed="false">Paradas +90 dias <span class="segmented__count" data-contagem="paradas">0</span></button>
      </div>
    </div>

    <section class="card card--flush produtos-lista" aria-label="Lista de produtos">
      <div class="table-wrap">
        <table class="data-table data-table--responsive produtos-tabela">
          <thead>
            <tr>
              <th scope="col">Peça</th>
              <th scope="col">Origem</th>
              <th scope="col" class="num">Preço</th>
              <th scope="col" class="num">Custo</th>
              <th scope="col" class="num">Margem</th>
              <th scope="col" class="produtos-tabela__centro">Estoque</th>
              <th scope="col">Situação</th>
              <th scope="col"><span class="sr-only">Ações</span></th>
            </tr>
          </thead>
          <tbody id="tabelaProdutos"></tbody>
        </table>
      </div>
      <div class="pager" id="paginacaoProdutos">
        <span id="paginacaoTexto"></span>
        <div class="pager__buttons">
          <button type="button" class="btn btn--secondary btn--compact" id="paginaAnterior">Anterior</button>
          <button type="button" class="btn btn--secondary btn--compact" id="paginaProxima">Próxima</button>
        </div>
      </div>
    </section>

    <input id="imagemProdutoExistente" class="sr-only" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=4"></script>
  <script src="../js/supabase-service.js?v=33"></script>
  <script src="../js/moeda-utils.js?v=2"></script>
  <script src="../js/financeiro-utils.js?v=3"></script>
  <script src="../js/alertas-regras.js?v=3"></script>
  <script src="../js/produtos.js?v=33"></script>
  <script src="../js/sidebar.js?v=8"></script>
</body>
</html>
