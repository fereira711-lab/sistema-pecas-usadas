<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque / Produtos</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="hero__tag">Estoque</p>
      <h1>Estoque / Produtos</h1>
      <p class="hero__description">
        Visualize pecas, estoque, custos, vendas e lucro.
      </p>
    </div>
  </header>

  <main class="container stock-layout">
    <section class="stock-card">
      <div class="stock-header">
        <div>
          <h2>Pecas cadastradas</h2>
          <p>Lista consolidada de pecas, estoque, custos, vendas e lucro.</p>
        </div>
        <a class="button-secondary" href="cadastro-peca.html">Cadastrar peca</a>
      </div>

      <p id="mensagemProdutos" class="empty-message"></p>

      <div class="table-wrapper">
        <table class="stock-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome da peca</th>
              <th>Origem</th>
              <th>Tipo de custo</th>
              <th>Qtd. total</th>
              <th>Qtd. vendida</th>
              <th>Qtd. disponivel</th>
              <th>Status</th>
              <th>Preco</th>
              <th>Lucro</th>
              <th>Preparada</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody id="tabelaProdutos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/supabase-service.js?v=14"></script>
  <script src="../js/produtos.js?v=9"></script>
</body>
</html>
