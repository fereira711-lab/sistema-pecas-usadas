<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque / Produtos</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-auth="protected" class="auth-checking ui-soft-dark">
  <header class="page-header">
    <div>
      <p class="hero__tag">Estoque</p>
      <h1>Estoque / Produtos</h1>
      <p class="hero__description">
        Localize peças disponíveis e execute as ações principais do estoque.
      </p>
    </div>
  </header>

  <main class="container stock-layout">
    <section class="stock-card">
      <div class="stock-header">
        <div>
          <h2>Peças cadastradas</h2>
          <p>Lista operacional para consultar estoque, vender, lançar custo ou abrir detalhes.</p>
        </div>
        <a class="button-secondary" href="cadastro-peca.html">Cadastrar peça</a>
      </div>

      <p id="mensagemProdutos" class="empty-message"></p>

      <div class="form-row filters-compact">
        <div class="form-group">
          <label for="buscaProdutos">Busca rápida</label>
          <input id="buscaProdutos" type="search" placeholder="SKU ou nome da peça">
        </div>

        <div class="form-group">
          <label for="filtroEstoqueProdutos">Estoque</label>
          <select id="filtroEstoqueProdutos">
            <option value="">Todos</option>
            <option value="em-estoque">Em estoque</option>
            <option value="sem-estoque">Sem estoque</option>
            <option value="estoque-baixo">Estoque baixo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="filtroOrigemProdutos">Origem</label>
          <select id="filtroOrigemProdutos">
            <option value="">Todas</option>
          </select>
        </div>

        <div class="form-group">
          <label for="ordenacaoProdutos">Ordenar por</label>
          <select id="ordenacaoProdutos">
            <option value="nome">Nome</option>
            <option value="sku">SKU</option>
            <option value="estoque">Estoque</option>
          </select>
        </div>
      </div>

      <input id="imagemProdutoExistente" class="file-input-hidden" type="file" accept="image/*">
      <div id="tabelaProdutos" class="product-card-grid" aria-label="Produtos cadastrados"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=4"></script>
  <script src="../js/supabase-service.js?v=25"></script>
  <script src="../js/produtos.js?v=24"></script>
  <script src="../js/sidebar.js?v=5"></script>
</body>
</html>
