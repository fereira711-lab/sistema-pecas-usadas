<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque / Produtos</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-auth="protected" class="auth-checking ui-soft-dark products-operational-page">
  <header class="page-header">
    <div>
      <p class="hero__tag">Estoque</p>
      <h1>Estoque / Produtos</h1>
      <p class="hero__description">
        Localize pecas disponiveis e execute as acoes principais do estoque.
      </p>
    </div>
  </header>

  <main class="container stock-layout products-page">
    <section class="stock-card products-shell">
      <div class="stock-header products-header">
        <div>
          <span class="piece-form-eyebrow">Estoque operacional</span>
          <h2>Produtos cadastrados</h2>
          <p>Consulta rapida de pecas, estoque, status e acoes principais.</p>
        </div>

        <div class="products-header__actions">
          <span class="piece-status-chip">Operacional</span>
          <a class="button-secondary products-action-primary" href="cadastro-peca.html">Cadastrar peca</a>
        </div>
      </div>

      <section class="products-toolbar" aria-label="Filtros e busca de produtos">
        <div class="products-main-controls">
          <div class="form-group products-page-size-field">
            <label for="quantidadePaginaProdutos">Por pagina</label>
            <select id="quantidadePaginaProdutos">
              <option value="12">12</option>
              <option value="24" selected>24</option>
              <option value="48">48</option>
              <option value="todos">Todos</option>
            </select>
          </div>

          <div class="form-group products-search-field">
            <label for="buscaProdutos">Buscar produto</label>
            <input id="buscaProdutos" type="search" placeholder="Buscar por SKU, nome ou codigo">
          </div>

          <button id="botaoAbrirFiltrosProdutos" class="button-secondary products-filter-toggle" type="button" aria-controls="painelFiltrosProdutos" aria-expanded="false">
            Filtros
          </button>
        </div>
      </section>

      <p id="mensagemProdutos" class="empty-message products-message"></p>

      <input id="imagemProdutoExistente" class="file-input-hidden" type="file" accept="image/*">

      <div class="products-content-layout">
        <section class="products-list" aria-labelledby="tituloListaProdutos">
          <div class="products-list__header">
            <div>
              <h3 id="tituloListaProdutos">Lista de produtos</h3>
            </div>
          </div>

          <div id="tabelaProdutos" class="product-card-grid" aria-label="Produtos cadastrados"></div>
        </section>
      </div>

      <aside id="painelFiltrosProdutos" class="products-filter-panel" aria-label="Filtros avancados de produtos">
        <div class="products-filter-panel__header">
          <h3>Filtros avancados</h3>
          <button id="botaoFecharFiltrosProdutos" class="products-filter-close" type="button" aria-label="Fechar filtros">X</button>
        </div>

        <div class="products-filters">
          <div class="form-group">
            <label for="filtroEstoqueProdutos">Estoque</label>
            <select id="filtroEstoqueProdutos">
              <option value="">Todos</option>
              <option value="em-estoque">Em estoque</option>
              <option value="sem-estoque">Sem estoque</option>
              <option value="estoque-baixo">Estoque baixo</option>
            </select>
          </div>

          <div class="form-group">
            <label for="filtroOrigemProdutos">Origem</label>
            <select id="filtroOrigemProdutos">
              <option value="">Todas</option>
            </select>
          </div>

          <div class="form-group">
            <label for="filtroStatusProdutos">Status</label>
            <select id="filtroStatusProdutos">
              <option value="">Todos</option>
              <option value="em_estoque">Em estoque</option>
              <option value="vendida">Vendido</option>
            </select>
          </div>

          <div class="form-group">
            <label for="ordenacaoProdutos">Ordenar por</label>
            <select id="ordenacaoProdutos">
              <option value="nome">Nome</option>
              <option value="sku">SKU</option>
              <option value="estoque">Estoque</option>
            </select>
          </div>
        </div>

        <div class="products-filter-panel__actions">
          <button id="botaoLimparFiltrosProdutos" class="button-secondary" type="button">Limpar filtros</button>
          <button id="botaoAplicarFiltrosProdutos" class="button-primary" type="button">Aplicar/Fechar</button>
        </div>
      </aside>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=4"></script>
  <script src="../js/supabase-service.js?v=25"></script>
  <script src="../js/produtos.js?v=29"></script>
  <script src="../js/sidebar.js?v=5"></script>
</body>
</html>
