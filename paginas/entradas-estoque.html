<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entradas de estoque</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css?v=16">
</head>
<body data-auth="protected" class="auth-checking ui-v2">
  <main class="page">
    <header class="page-head">
      <div class="page-head__text">
        <h1 class="page-head__title">Entradas de estoque</h1>
        <p class="page-head__subtitle" id="resumoEntradas">Carregando entradas…</p>
      </div>
      <div class="page-head__actions">
        <a class="btn btn--primary" href="cadastro-peca.html">
          <i class="ri-add-line" aria-hidden="true"></i>Nova peça
        </a>
      </div>
    </header>

    <p id="mensagemEntradasEstoque" class="page-message" role="status"></p>

    <section id="kpisEntradas" class="kpi-grid" aria-label="Resumo das entradas"></section>

    <div class="toolbar">
      <div class="toolbar__group">
        <div class="search-field">
          <label class="sr-only" for="buscaEntradasEstoque">Buscar entrada</label>
          <i class="ri-search-line search-field__icon" aria-hidden="true"></i>
          <input id="buscaEntradasEstoque" class="input" type="search" placeholder="Buscar por SKU, peça, origem ou código da entrada" autocomplete="off">
        </div>
        <label class="sr-only" for="filtroOrigemEntradas">Filtrar por origem</label>
        <select id="filtroOrigemEntradas" class="select">
          <option value="">Todas as origens</option>
        </select>
        <div class="filtro-periodo">
          <label class="filtro-periodo__rotulo" for="dataInicialEntradas">De</label>
          <input id="dataInicialEntradas" class="input filtro-periodo__data" type="date">
          <label class="filtro-periodo__rotulo" for="dataFinalEntradas">até</label>
          <input id="dataFinalEntradas" class="input filtro-periodo__data" type="date">
        </div>
      </div>
      <div class="segmented" role="group" aria-label="Situação do saldo" id="filtroStatusEntradas">
        <button type="button" class="segmented__item" data-status="" aria-pressed="true">Todas <span class="segmented__count" data-contagem="">0</span></button>
        <button type="button" class="segmented__item" data-status="com-saldo" aria-pressed="false">Com saldo <span class="segmented__count" data-contagem="com-saldo">0</span></button>
        <button type="button" class="segmented__item" data-status="parcial" aria-pressed="false">Parcial <span class="segmented__count" data-contagem="parcial">0</span></button>
        <button type="button" class="segmented__item" data-status="consumida" aria-pressed="false">Consumida <span class="segmented__count" data-contagem="consumida">0</span></button>
      </div>
    </div>

    <section class="card card--table" aria-label="Lista de entradas de estoque">
      <div class="table-wrap">
        <table class="data-table data-table--responsive">
          <thead>
            <tr>
              <th scope="col">Data</th>
              <th scope="col">Peça</th>
              <th scope="col">Origem</th>
              <th scope="col" class="num">Qtd.</th>
              <th scope="col" class="num">Consumida</th>
              <th scope="col" class="num">Saldo</th>
              <th scope="col" class="num">Custo unitário</th>
              <th scope="col" class="num">Valor atribuído</th>
              <th scope="col">Situação</th>
            </tr>
          </thead>
          <tbody id="tabelaEntradas"></tbody>
        </table>
      </div>
      <div class="pager" id="paginacaoEntradas" hidden>
        <span id="paginacaoTexto"></span>
        <div class="pager__buttons">
          <button type="button" class="btn btn--secondary btn--compact" id="paginaAnterior">Anterior</button>
          <button type="button" class="btn btn--secondary btn--compact" id="paginaProxima">Próxima</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=5"></script>
  <script src="../js/moeda-utils.js?v=2"></script>
  <script src="../js/supabase-service.js?v=36"></script>
  <script src="../js/financeiro-utils.js?v=7"></script>
  <script src="../js/entradas-estoque.js?v=8"></script>
  <script src="../js/sidebar.js?v=10"></script>
</body>
</html>
