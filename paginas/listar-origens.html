<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css?v=12">
  <link rel="stylesheet" href="../css/origens.css?v=1">
</head>
<body data-auth="protected" class="auth-checking ui-v2">
  <main class="page">
    <header class="page-head">
      <div class="page-head__text">
        <h1 class="page-head__title">Origens</h1>
        <p class="page-head__subtitle" id="resumoOrigens">Carregando origens…</p>
      </div>
      <div class="page-head__actions">
        <a class="btn btn--primary" href="cadastro-origem.html">
          <i class="ri-add-line" aria-hidden="true"></i>Nova origem
        </a>
      </div>
    </header>

    <p id="mensagemOrigens" class="page-message" role="status"></p>

    <section id="kpisOrigens" class="kpi-grid" aria-label="Resumo das origens"></section>

    <div class="toolbar">
      <div class="toolbar__group">
        <div class="search-field">
          <label class="sr-only" for="buscaOrigens">Buscar origem</label>
          <i class="ri-search-line search-field__icon" aria-hidden="true"></i>
          <input id="buscaOrigens" class="input" type="search" placeholder="Buscar por código, descrição ou tipo" autocomplete="off">
        </div>
        <label class="sr-only" for="filtroTipoOrigem">Filtrar por tipo</label>
        <select id="filtroTipoOrigem" class="select">
          <option value="">Todos os tipos</option>
        </select>
        <div class="origens-periodo">
          <label class="origens-periodo__rotulo" for="filtroDataInicialOrigem">Compra de</label>
          <input id="filtroDataInicialOrigem" class="input origens-periodo__data" type="date">
          <label class="origens-periodo__rotulo" for="filtroDataFinalOrigem">até</label>
          <input id="filtroDataFinalOrigem" class="input origens-periodo__data" type="date">
        </div>
      </div>
      <div class="segmented" role="group" aria-label="Situação da distribuição" id="filtroDistribuicaoOrigem">
        <button type="button" class="segmented__item" data-situacao="" aria-pressed="true">Todas <span class="segmented__count" data-contagem="">0</span></button>
        <button type="button" class="segmented__item" data-situacao="pendente" aria-pressed="false">Falta distribuir <span class="segmented__count" data-contagem="pendente">0</span></button>
        <button type="button" class="segmented__item" data-situacao="distribuida" aria-pressed="false">Distribuída <span class="segmented__count" data-contagem="distribuida">0</span></button>
        <button type="button" class="segmented__item" data-situacao="acima" aria-pressed="false">Acima do pago <span class="segmented__count" data-contagem="acima">0</span></button>
        <button type="button" class="segmented__item" data-situacao="sem-valor" aria-pressed="false">Sem valor pago <span class="segmented__count" data-contagem="sem-valor">0</span></button>
      </div>
    </div>

    <section class="card card--table" aria-label="Lista de origens">
      <div class="table-wrap">
        <table class="data-table data-table--responsive">
          <thead>
            <tr>
              <th scope="col">Origem</th>
              <th scope="col">Tipo</th>
              <th scope="col">Compra</th>
              <th scope="col" class="num">Valor pago</th>
              <th scope="col" class="num">Distribuído</th>
              <th scope="col" class="num">A distribuir</th>
              <th scope="col" class="num">Peças</th>
              <th scope="col">Situação</th>
            </tr>
          </thead>
          <tbody id="tabelaOrigens"></tbody>
        </table>
      </div>
      <div class="pager" id="paginacaoOrigens" hidden>
        <span id="paginacaoTexto"></span>
        <div class="pager__buttons">
          <button type="button" class="btn btn--secondary btn--compact" id="paginaAnterior">Anterior</button>
          <button type="button" class="btn btn--secondary btn--compact" id="paginaProxima">Próxima</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=4"></script>
  <script src="../js/moeda-utils.js?v=2"></script>
  <script src="../js/supabase-service.js?v=36"></script>
  <script src="../js/listar-origens.js?v=13"></script>
  <script src="../js/sidebar.js?v=9"></script>
</body>
</html>
