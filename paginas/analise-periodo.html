<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análises</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css?v=16">
</head>
<body data-auth="protected" class="auth-checking ui-v2">
  <main class="page">
    <header class="page-head">
      <div class="page-head__text">
        <h1 class="page-head__title">Análises</h1>
        <p class="page-head__subtitle">Resultado das vendas num intervalo de datas.</p>
        <nav class="tabs" aria-label="Tipos de análise">
          <a class="tabs__item" href="analise-produto.html">Por produto</a>
          <a class="tabs__item" href="analise-periodo.html" aria-current="page">Por período</a>
          <a class="tabs__item" href="analise-custos.html">Custos</a>
          <a class="tabs__item" href="giro-estoque.html">Giro de estoque</a>
        </nav>
      </div>
    </header>

    <p id="mensagemAnalisePeriodo" class="page-message" role="status"></p>

    <section id="resumoAnalisePeriodo" class="kpi-grid" aria-label="Resumo da análise por período"></section>

    <div class="toolbar">
      <div class="toolbar__group">
        <div class="search-field">
          <label class="sr-only" for="buscaAnalisePeriodo">Buscar venda</label>
          <i class="ri-search-line search-field__icon" aria-hidden="true"></i>
          <input id="buscaAnalisePeriodo" class="input" type="search" placeholder="Buscar por SKU, peça ou canal" autocomplete="off">
        </div>
        <label class="sr-only" for="periodoRapido">Período</label>
        <select id="periodoRapido" class="select">
          <option value="mes">Mês atual</option>
          <option value="hoje">Hoje</option>
          <option value="7">Últimos 7 dias</option>
          <option value="30">Últimos 30 dias</option>
          <option value="personalizado">Personalizado</option>
        </select>
        <div class="filtro-periodo">
          <label class="filtro-periodo__rotulo" for="dataInicial">De</label>
          <input id="dataInicial" class="input filtro-periodo__data" type="date">
          <label class="filtro-periodo__rotulo" for="dataFinal">até</label>
          <input id="dataFinal" class="input filtro-periodo__data" type="date">
        </div>
        <label class="sr-only" for="filtroCanalAnalisePeriodo">Canal</label>
        <select id="filtroCanalAnalisePeriodo" class="select">
          <option value="">Todos os canais</option>
        </select>
      </div>
      <div class="segmented" role="group" aria-label="Situação do custo" id="filtroCustoAnalisePeriodo">
        <button type="button" class="segmented__item" data-custo="" aria-pressed="true">Todas <span class="segmented__count" data-contagem="">0</span></button>
        <button type="button" class="segmented__item" data-custo="calculado" aria-pressed="false">Custo calculado <span class="segmented__count" data-contagem="calculado">0</span></button>
        <button type="button" class="segmented__item" data-custo="pendente" aria-pressed="false">Custo não calculado <span class="segmented__count" data-contagem="pendente">0</span></button>
      </div>
    </div>

    <section class="card card--table" aria-label="Resultado por venda">
      <div class="table-wrap">
        <table class="data-table data-table--responsive">
          <thead>
            <tr>
              <th scope="col">Data</th>
              <th scope="col">Peça</th>
              <th scope="col">Canal</th>
              <th scope="col" class="num">Qtd.</th>
              <th scope="col" class="num">Receita</th>
              <th scope="col" class="num">Custo da peça</th>
              <th scope="col" class="num">Custos da venda</th>
              <th scope="col" class="num">Lucro</th>
              <th scope="col" class="num">Margem</th>
              <th scope="col"><span class="sr-only">Ações</span></th>
            </tr>
          </thead>
          <tbody id="tabelaAnalisePeriodo"></tbody>
        </table>
      </div>
      <div class="pager" id="paginacaoAnalisePeriodo" hidden>
        <span id="paginacaoTextoAnalisePeriodo"></span>
        <div class="pager__buttons">
          <button type="button" class="btn btn--secondary btn--compact" id="paginaAnteriorAnalisePeriodo">Anterior</button>
          <button type="button" class="btn btn--secondary btn--compact" id="paginaProximaAnalisePeriodo">Próxima</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=4"></script>
  <script src="../js/moeda-utils.js?v=2"></script>
  <script src="../js/supabase-service.js?v=36"></script>
  <script src="../js/financeiro-utils.js?v=6"></script>
  <script src="../js/analise-periodo.js?v=7"></script>
  <script src="../js/sidebar.js?v=9"></script>
</body>
</html>
