<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Origem</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="hero__tag">Cadastro</p>
      <h1>Cadastrar Origem</h1>
      <p class="hero__description">
        Registre a origem primeiro. As pecas e as entradas de estoque ficam no cadastro de peca.
      </p>
    </div>
  </header>

  <main class="container form-layout">
    <section class="form-card">
        <div class="form-group">
          <label for="codigoOrigem">Codigo da origem</label>
          <input id="codigoOrigem" readonly placeholder="Gerado automaticamente">
        </div>

        <div class="form-group">
          <label for="tipoOrigem">Tipo de origem *</label>
          <select id="tipoOrigem" name="tipoOrigem" required>
            <option value="">Selecione uma opcao</option>
            <option value="Compra avulsa">Compra avulsa</option>
            <option value="Carro para desmonte">Carro para desmonte</option>
            <option value="Lote">Lote</option>
          </select>
        </div>

        <div class="form-group">
          <label for="descricao">Descricao da origem *</label>
          <input
            id="descricao"
            name="descricao"
            type="text"
            placeholder="Ex: Fiat Uno 2012 para desmonte"
            required
          >
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="custoTotal">Valor *</label>
            <input
              id="custoTotal"
              name="custoTotal"
              type="number"
              min="0"
              step="0.01"
              placeholder="Ex: 2500.00"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="dataCompra">Data *</label>
          <input id="dataCompra" name="dataCompra" type="date" required>
        </div>

        <div class="form-group">
          <label for="observacoes">Observacoes</label>
          <textarea
            id="observacoes"
            name="observacoes"
            rows="4"
            placeholder="Ex: Compra feita com nota, pecas ainda serao avaliadas."
          ></textarea>
        </div>

        <p id="mensagemFormulario" class="form-message" aria-live="polite"></p>

        <div class="form-actions">
          <button type="button" class="button-primary" onclick="salvarOrigem()">Salvar Origem</button>
          <a class="button-secondary" href="cadastro-peca.html">Ir para pecas</a>
          <a class="button-secondary" href="../index.html">Voltar para o painel</a>
        </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=4"></script>
  <script src="../js/supabase-service.js?v=25"></script>
  <script src="../js/origem.js?v=5"></script>
</body>
</html>
