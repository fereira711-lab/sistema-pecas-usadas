<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Venda</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-auth="protected" class="auth-checking ui-soft-dark">
  <header class="page-header">
    <div>
      <p class="hero__tag">Cadastro</p>
      <h1>Cadastrar Venda</h1>
      <p class="hero__description">
        Registre a venda de uma peça pelo estoque disponível, com campos diretos para finalizar a operação.
      </p>
    </div>
  </header>

  <main class="container form-layout">
    <section class="form-card">
      <h2>Cadastrar Venda</h2>

      <div class="form-group">
        <input id="buscaPecaVenda" type="search" placeholder="Pesquisar peça (nome ou SKU)">
        <input id="pecaId" type="hidden">
        <div id="sugestoesPecaVenda" class="autocomplete-list" role="listbox"></div>
      </div>

      <div class="form-group">
        <input id="valorVenda" type="number" placeholder="Valor de venda unitário">
      </div>

      <div class="form-group">
        <input id="quantidadeVendidaNaVenda" type="number" placeholder="Quantidade vendida">
      </div>

      <div class="form-group">
        <label for="dataVenda">Data da venda</label>
        <input id="dataVenda" name="data_venda" type="date" required>
      </div>

      <div class="form-group">
        <input id="canalVenda" placeholder="Canal da venda">
      </div>

      <section class="optional-fields">
        <div class="stock-header">
          <div>
            <h2>Custos adicionais da venda</h2>
            <p>Adicione quantos custos forem necessarios para calcular o resultado da venda.</p>
          </div>
        </div>

        <div id="listaCustosVenda" class="cost-lines"></div>

        <div class="form-actions">
          <button id="botaoAdicionarCustoVenda" type="button" class="button-secondary">+ Adicionar custo</button>
          <button id="botaoNovoTipoCustoVenda" type="button" class="button-secondary">+ Novo tipo</button>
        </div>
      </section>

      <div class="form-actions">
        <button type="button" class="button-primary" onclick="salvarVenda()">Salvar</button>
        <a class="button-secondary" href="historico-vendas.html">Ver vendas</a>
        <a class="button-secondary" href="../index.html">Voltar para o painel</a>
      </div>

      <p id="mensagemVenda" class="form-message" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=4"></script>
  <script src="../js/supabase-service.js?v=29"></script>
  <script src="../js/venda.js?v=18"></script>
  <script src="../js/sidebar.js?v=5"></script>
</body>
</html>
