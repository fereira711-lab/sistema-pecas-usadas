<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes da origem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css?v=16">
  <link rel="stylesheet" href="../css/detalhes-origem.css?v=3">
</head>
<body data-auth="protected" class="auth-checking ui-v2">
  <main class="page">
    <header class="page-head">
      <div class="page-head__text">
        <a class="page-head__back" href="listar-origens.html"><i class="ri-arrow-left-s-line" aria-hidden="true"></i>Origens</a>
        <h1 class="page-head__title" id="tituloOrigem">Origem</h1>
        <p class="page-head__subtitle" id="subtituloOrigem">Carregando origem…</p>
        <p class="origem-observacao" id="observacaoOrigem" hidden></p>
      </div>
      <div class="page-head__actions">
        <button type="button" id="botaoEditarOrigem" class="btn btn--secondary" disabled>Editar origem</button>
        <a class="btn btn--primary" id="linkAdicionarPeca" href="cadastro-peca.html">
          <i class="ri-add-line" aria-hidden="true"></i>Adicionar peça
        </a>
      </div>
    </header>

    <p id="mensagemOrigem" class="page-message" role="status"></p>

    <form id="formEditarOrigem" class="card origem-edicao" aria-labelledby="tituloEdicaoOrigem" hidden>
      <div class="card__head">
        <h2 class="card__title" id="tituloEdicaoOrigem">Editar origem</h2>
      </div>
      <div class="field-grid field-grid--3">
        <div class="field">
          <label class="field__label" for="editarOrigemTipo">Tipo</label>
          <input id="editarOrigemTipo" class="input" type="text" required>
        </div>
        <div class="field">
          <label class="field__label" for="editarOrigemDataCompra">Data da compra</label>
          <input id="editarOrigemDataCompra" class="input" type="date" required>
        </div>
        <div class="field">
          <label class="field__label" for="editarOrigemCustoTotal">Valor pago</label>
          <input id="editarOrigemCustoTotal" class="input" type="text" inputmode="decimal" autocomplete="off">
        </div>
      </div>
      <div class="field-grid">
        <div class="field">
          <label class="field__label" for="editarOrigemDescricao">Descrição</label>
          <input id="editarOrigemDescricao" class="input" type="text" required>
        </div>
        <div class="field">
          <label class="field__label" for="editarOrigemQuantidadeTotal">Quantidade prevista <span class="field__optional">(opcional)</span></label>
          <input id="editarOrigemQuantidadeTotal" class="input" type="number" min="0" step="1">
        </div>
      </div>
      <div class="field">
        <label class="field__label" for="editarOrigemObservacoes">Observações <span class="field__optional">(opcional)</span></label>
        <textarea id="editarOrigemObservacoes" class="input" rows="3"></textarea>
      </div>
      <div class="origem-edicao__acoes">
        <button type="button" id="cancelarEdicaoOrigem" class="btn btn--secondary">Cancelar</button>
        <button type="submit" class="btn btn--primary">Salvar origem</button>
      </div>
    </form>

    <section id="kpisOrigem" class="kpi-grid" aria-label="Resumo da origem"></section>

    <section class="card origem-retorno" aria-labelledby="tituloRetornoOrigem" id="blocoRetornoOrigem" hidden>
      <div class="origem-retorno__topo">
        <h2 class="card__title" id="tituloRetornoOrigem">Retorno da origem</h2>
        <span class="origem-retorno__percentual" id="percentualRetornoOrigem"></span>
      </div>
      <div class="progress progress--thick" id="barraRetornoOrigem" role="progressbar" aria-labelledby="tituloRetornoOrigem" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress__bar" id="preenchimentoRetornoOrigem"></div>
      </div>
      <div class="origem-retorno__legenda">
        <span>R$ 0</span><span id="legendaPagoOrigem"></span>
      </div>
      <p class="origem-retorno__frase" id="fraseRetornoOrigem"></p>
    </section>

    <section class="card card--flush" aria-labelledby="tituloPecasOrigem" id="blocoPecasOrigem" hidden>
      <div class="card__head origem-pecas__topo">
        <h2 class="card__title" id="tituloPecasOrigem">Peças desta origem</h2>
        <div class="segmented" role="group" aria-label="Situação" id="filtroPecasOrigem">
          <button type="button" class="segmented__item" data-filtro="todas" aria-pressed="true">Todas <span class="segmented__count" data-contagem="todas">0</span></button>
          <button type="button" class="segmented__item" data-filtro="vendidas" aria-pressed="false">Vendidas <span class="segmented__count" data-contagem="vendidas">0</span></button>
          <button type="button" class="segmented__item" data-filtro="estoque" aria-pressed="false">Em estoque <span class="segmented__count" data-contagem="estoque">0</span></button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table data-table--responsive origem-pecas">
          <thead>
            <tr>
              <th scope="col">Peça</th>
              <th scope="col" class="num">Custo atribuído</th>
              <th scope="col" class="num">Preço / vendida por</th>
              <th scope="col">Situação</th>
              <th scope="col" class="num">Lucro</th>
            </tr>
          </thead>
          <tbody id="tabelaPecasOrigem"></tbody>
        </table>
      </div>
      <div class="origem-pecas__rodape" id="rodapePecasOrigem"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=6"></script>
  <script src="../js/auth.js?v=4"></script>
  <script src="../js/moeda-utils.js?v=2"></script>
  <script src="../js/supabase-service.js?v=36"></script>
  <script src="../js/financeiro-utils.js?v=7"></script>
  <script src="../js/alertas-regras.js?v=5"></script>
  <script src="../js/detalhes-origem.js?v=24"></script>
  <script src="../js/sidebar.js?v=10"></script>
</body>
</html>
