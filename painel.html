<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Geral</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-auth="protected" class="auth-checking ui-soft-dark general-dashboard-page">
  <header class="page-header general-dashboard-topbar">
    <div>
      <p class="hero__tag">Painel Geral</p>
      <h1>Painel Geral</h1>
      <p class="hero__description">Visão inicial operacional do sistema.</p>
    </div>
    <span class="status-badge status-badge--info">Operacional</span>
  </header>

  <main class="container stock-layout general-dashboard-layout">
    <p id="mensagemPainelGeral" class="empty-message"></p>

    <section id="cardsPainelGeral" class="summary-grid general-dashboard-summary" aria-label="Resumo operacional"></section>

    <section class="general-dashboard-main-grid">
      <article class="stock-card general-dashboard-section general-dashboard-shortcuts-card">
        <div class="stock-header general-dashboard-section__header">
          <div>
            <p class="hero__tag">Atalhos</p>
            <h2>Ações rápidas</h2>
          </div>
        </div>
        <nav id="atalhosPainelGeral" class="dashboard-shortcuts" aria-label="Atalhos principais"></nav>
      </article>

      <article class="stock-card general-dashboard-section general-dashboard-alerts-card">
        <div class="stock-header general-dashboard-section__header">
          <div>
            <p class="hero__tag">Atenção</p>
            <h2>Alertas importantes</h2>
          </div>
          <a class="button-secondary" href="paginas/alertas.html">Ver alertas</a>
        </div>
        <section id="alertasPainelGeral" aria-label="Alertas importantes do painel"></section>
      </article>
    </section>

    <section class="general-dashboard-content-grid">
      <article class="stock-card general-dashboard-section general-dashboard-sales-card">
        <div class="stock-header general-dashboard-section__header">
          <div>
            <p class="hero__tag">Vendas</p>
            <h2>Últimas vendas</h2>
          </div>
          <a class="button-secondary" href="paginas/historico-vendas.html">Histórico</a>
        </div>

        <p id="mensagemUltimasVendas" class="empty-message"></p>

        <div class="general-dashboard-list" role="table" aria-label="Últimas vendas">
          <div class="general-dashboard-row general-dashboard-row--head" role="row">
            <span>Data</span>
            <span>SKU</span>
            <span>Peça</span>
            <span>Qtd.</span>
            <span>Canal</span>
            <span>Ação</span>
          </div>
          <div id="listaUltimasVendas"></div>
        </div>
      </article>

      <article class="stock-card general-dashboard-section general-dashboard-movements-card">
        <div class="stock-header general-dashboard-section__header">
          <div>
            <p class="hero__tag">Movimentações</p>
            <h2>Recentes</h2>
          </div>
        </div>
        <div id="movimentacoesPainelGeral" class="dashboard-movements" aria-label="Movimentações recentes"></div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=6"></script>
  <script src="js/auth.js?v=4"></script>
  <script src="js/supabase-service.js?v=28"></script>
  <script src="js/financeiro-utils.js?v=1"></script>
  <script src="js/painel-geral.js?v=11"></script>
  <script src="js/sidebar.js?v=5"></script>
</body>
</html>
